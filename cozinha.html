<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cozinha — PizzaLanche Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #080810;
      --card: #12121f;
      --card2: #1a1a2e;
      --border: rgba(255,255,255,0.08);
      --primary: #ff6b35;
      --secondary: #e8439a;
      --green: #2ecc71;
      --yellow: #f39c12;
      --red: #e74c3c;
      --blue: #4f8ef7;
      --text: #f0f0f8;
      --muted: #7070a0;
      --radius: 16px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px;
      background: rgba(18,18,31,0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 10;
    }
    .header-logo { display: flex; align-items: center; gap: 12px; }
    .logo-emoji { font-size: 2rem; filter: drop-shadow(0 0 10px var(--primary)); }
    .logo-name { font-size: 1.2rem; font-weight: 800; background: linear-gradient(135deg, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .logo-sub { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
    .header-right { display: flex; align-items: center; gap: 20px; }
    .clock { font-size: 2rem; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text); letter-spacing: 2px; }
    .live-badge { display: flex; align-items: center; gap: 7px; background: rgba(46,204,113,0.15); border: 1px solid rgba(46,204,113,0.35); padding: 5px 14px; border-radius: 99px; font-size: 0.8rem; font-weight: 700; color: var(--green); }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.1)} }
    .last-update { font-size: 0.75rem; color: var(--muted); }

    main { padding: 24px 28px; }
    h2.section-title {
      font-size: 1rem; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 14px; padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    h2.section-title span.count {
      background: var(--primary); color: white;
      font-size: 0.75rem; padding: 2px 10px; border-radius: 99px;
      font-weight: 800;
    }
    section.orders-section { margin-bottom: 30px; }
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }

    .order-card {
      background: var(--card);
      border-radius: var(--radius);
      padding: 18px;
      border: 2px solid transparent;
      position: relative;
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      animation: cardIn 0.35s ease;
    }
    @keyframes cardIn { from{opacity:0;transform:translateY(-12px)} to{opacity:1;transform:translateY(0)} }
    .order-card.delivery { border-color: rgba(255,107,53,0.4); box-shadow: 0 0 20px rgba(255,107,53,0.12); }
    .order-card.mesa     { border-color: rgba(79,142,247,0.4); box-shadow: 0 0 20px rgba(79,142,247,0.12); }
    .order-card.urgent   { border-color: var(--red); box-shadow: 0 0 24px rgba(231,76,60,0.25); animation: urgentPulse 1.5s infinite; }
    @keyframes urgentPulse { 0%,100%{box-shadow:0 0 24px rgba(231,76,60,0.25)} 50%{box-shadow:0 0 40px rgba(231,76,60,0.45)} }

    .card-header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-type-badge { font-size: 0.7rem; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; padding: 3px 10px; border-radius: 99px; }
    .badge-delivery { background: rgba(255,107,53,0.2); color: var(--primary); border: 1px solid rgba(255,107,53,0.4); }
    .badge-mesa     { background: rgba(79,142,247,0.2); color: var(--blue);    border: 1px solid rgba(79,142,247,0.4); }
    .card-timer { font-size: 0.8rem; font-weight: 700; display: flex; align-items: center; gap: 5px; }
    .card-timer.ok     { color: var(--green); }
    .card-timer.warn   { color: var(--yellow); }
    .card-timer.danger { color: var(--red); }

    .card-title-row { margin-bottom: 8px; }
    .order-name { font-size: 1.2rem; font-weight: 900; line-height: 1.1; }
    .order-sub  { font-size: 0.8rem; color: var(--muted); margin-top: 2px; }

    .items-list { background: var(--card2); border-radius: 10px; padding: 12px; margin: 10px 0; }
    .item-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); }
    .item-row:last-child { border-bottom: none; }
    .item-qty { font-size: 1rem; font-weight: 900; color: var(--primary); min-width: 28px; }
    .item-emoji { font-size: 1.2rem; }
    .item-name { flex: 1; font-size: 0.88rem; font-weight: 600; }

    .card-obs { background: rgba(243,156,18,0.1); border: 1px solid rgba(243,156,18,0.3); border-radius: 8px; padding: 7px 10px; font-size: 0.8rem; color: var(--yellow); margin-top: 8px; }

    .card-actions { display: flex; gap: 8px; margin-top: 12px; }
    .btn-ready {
      flex: 1; padding: 11px; border-radius: 10px; font-weight: 800; font-size: 0.88rem;
      background: linear-gradient(135deg, var(--green), #27ae60);
      color: white; border: none; cursor: pointer; transition: all 0.2s ease;
      box-shadow: 0 3px 12px rgba(46,204,113,0.35);
    }
    .btn-ready:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(46,204,113,0.5); }
    .btn-ready:active { transform: scale(0.98); }
    .btn-skip { padding: 11px 14px; border-radius: 10px; background: var(--card2); color: var(--muted); font-weight: 700; font-size: 0.8rem; border: 1px solid var(--border); cursor: pointer; transition: all 0.2s ease; }
    .btn-skip:hover { color: var(--text); border-color: var(--border); }

    .empty-kitchen {
      text-align: center; padding: 80px 20px; color: var(--muted);
    }
    .empty-kitchen .big-emoji { font-size: 5rem; display: block; margin-bottom: 16px; }
    .empty-kitchen h3 { font-size: 1.5rem; font-weight: 800; color: var(--text); margin-bottom: 8px; }
    .empty-kitchen p { font-size: 1rem; }

    .stats-bar { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-pill { display: flex; align-items: center; gap: 8px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 18px; }
    .stat-pill .pill-icon { font-size: 1.3rem; }
    .stat-pill .pill-label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; }
    .stat-pill .pill-value { font-size: 1.1rem; font-weight: 800; }
  </style>
</head>
<body>
  <header>
    <div class="header-logo">
      <div class="logo-emoji">👨‍🍳</div>
      <div>
        <div class="logo-name">PizzaLanche Pro</div>
        <div class="logo-sub">Painel da Cozinha</div>
      </div>
    </div>
    <div class="header-right">
      <div class="live-badge"><span class="live-dot"></span>AO VIVO</div>
      <div>
        <div class="clock" id="clock">--:--:--</div>
        <div class="last-update" id="last-update">Atualizado agora</div>
      </div>
    </div>
  </header>

  <main>
    <div class="stats-bar" id="stats-bar">
      <div class="stat-pill"><span class="pill-icon">📦</span><div><div class="pill-label">Delivery</div><div class="pill-value" id="stat-delivery">0</div></div></div>
      <div class="stat-pill"><span class="pill-icon">🍽️</span><div><div class="pill-label">Mesas</div><div class="pill-value" id="stat-mesas">0</div></div></div>
      <div class="stat-pill"><span class="pill-icon">⏳</span><div><div class="pill-label">Total na Cozinha</div><div class="pill-value" id="stat-total">0</div></div></div>
    </div>

    <div id="kitchen-content"></div>
  </main>

  <script>
    // Clock
    function updateClock() {
      const d = new Date();
      const t = d.toLocaleTimeString('pt-BR');
      document.getElementById('clock').textContent = t;
    }
    setInterval(updateClock, 1000); updateClock();

    // Minutes elapsed
    function elapsed(ms) {
      const m = Math.floor((Date.now() - ms) / 60000);
      return m;
    }
    function timerClass(m) {
      if (m < 10) return 'ok';
      if (m < 20) return 'warn';
      return 'danger';
    }
    function timerText(m) {
      if (m < 1) return '< 1 min';
      return `${m} min`;
    }

    let lastData = null;

    function renderKitchen(data) {
      const content = document.getElementById('kitchen-content');
      const deliveryOrders = data.deliveryOrders || [];
      const mesas = data.mesas || [];

      document.getElementById('stat-delivery').textContent = deliveryOrders.length;
      document.getElementById('stat-mesas').textContent = mesas.length;
      document.getElementById('stat-total').textContent = deliveryOrders.length + mesas.length;

      if (deliveryOrders.length === 0 && mesas.length === 0) {
        content.innerHTML = `
          <div class="empty-kitchen">
            <span class="big-emoji">🎉</span>
            <h3>Tudo em dia!</h3>
            <p>Nenhum pedido aguardando preparo</p>
          </div>`;
        return;
      }

      let html = '';

      // Delivery orders
      if (deliveryOrders.length > 0) {
        html += `<section class="orders-section">
          <h2 class="section-title">🛵 Delivery <span class="count">${deliveryOrders.length}</span></h2>
          <div class="orders-grid">`;
        deliveryOrders.forEach(o => {
          const m = elapsed(o.createdAt);
          const tc = timerClass(m);
          const urgent = m >= 20;
          html += `
            <div class="order-card delivery ${urgent?'urgent':''}">
              <div class="card-header-row">
                <span class="card-type-badge badge-delivery">🛵 Delivery</span>
                <span class="card-timer ${tc}">⏱ ${timerText(m)}</span>
              </div>
              <div class="card-title-row">
                <div class="order-name">${o.cliente} <span style="font-size:0.8rem;color:var(--muted)">#${String(o.id).padStart(3,'0')}</span></div>
                <div class="order-sub">📍 ${o.endereco||''}</div>
              </div>
              <div class="items-list">
                ${(o.items||[]).map(i=>`
                  <div class="item-row">
                    <span class="item-qty">${i.qty}x</span>
                    <span class="item-emoji">${i.emoji}</span>
                    <span class="item-name">${i.name}</span>
                  </div>`).join('')}
              </div>
              ${o.observacoes?`<div class="card-obs">⚠️ ${o.observacoes}</div>`:''}
              <div class="card-actions">
                <button class="btn-ready" onclick="markReady('delivery',${o.id})">✅ Pronto para Entrega</button>
              </div>
            </div>`;
        });
        html += `</div></section>`;
      }

      // Mesas
      if (mesas.length > 0) {
        html += `<section class="orders-section">
          <h2 class="section-title">🍽️ Mesas <span class="count" style="background:var(--blue)">${mesas.length}</span></h2>
          <div class="orders-grid">`;
        mesas.forEach(m => {
          const mins = elapsed(m.openTime);
          const tc = timerClass(mins);
          const urgent = mins >= 30;
          html += `
            <div class="order-card mesa ${urgent?'urgent':''}">
              <div class="card-header-row">
                <span class="card-type-badge badge-mesa">🍽️ Mesa ${m.id}</span>
                <span class="card-timer ${tc}">⏱ ${timerText(mins)}</span>
              </div>
              <div class="card-title-row">
                <div class="order-name">Mesa ${m.id} ${m.cliente?`— ${m.cliente}`:''}</div>
                <div class="order-sub">👤 ${m.pessoas} pessoa(s)</div>
              </div>
              <div class="items-list">
                ${(m.items||[]).map(i=>`
                  <div class="item-row">
                    <span class="item-qty">${i.qty}x</span>
                    <span class="item-emoji">${i.emoji}</span>
                    <span class="item-name">${i.name}</span>
                  </div>`).join('')}
              </div>
            </div>`;
        });
        html += `</div></section>`;
      }

      content.innerHTML = html;
    }

    function markReady(type, id) {
      // This updates localStorage so the main system picks it up
      try {
        const stateRaw = localStorage.getItem('plp_state');
        if (!stateRaw) { alert('Sistema principal não encontrado!'); return; }
        const state = JSON.parse(stateRaw);
        if (type === 'delivery') {
          const order = state.deliveryOrders.find(o => o.id === id);
          if (order && order.status === 'preparando') { order.status = 'saiu'; }
          else if (order && order.status === 'recebido') { order.status = 'preparando'; }
        }
        localStorage.setItem('plp_state', JSON.stringify(state));
        loadKitchenData();
        playBeep();
      } catch(e) { console.error(e); }
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator(); const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880; o.type = 'sine';
        g.gain.setValueAtTime(0.3, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
        o.start(); o.stop(ctx.currentTime + 0.2);
      } catch(e) {}
    }

    function loadKitchenData() {
      try {
        // First try dedicated kitchen sync
        const kitchenRaw = localStorage.getItem('plp_kitchen');
        if (kitchenRaw) {
          const data = JSON.parse(kitchenRaw);
          renderKitchen(data);
          document.getElementById('last-update').textContent = 'Atualizado agora';
          return;
        }
        // Fallback: read full state
        const stateRaw = localStorage.getItem('plp_state');
        if (stateRaw) {
          const state = JSON.parse(stateRaw);
          renderKitchen({
            deliveryOrders: (state.deliveryOrders||[]).filter(o=>o.status==='preparando'||o.status==='recebido'),
            mesas: (state.mesas||[]).filter(m=>m.status==='occupied'),
          });
          document.getElementById('last-update').textContent = 'Atualizado agora';
        } else {
          document.getElementById('kitchen-content').innerHTML = `
            <div class="empty-kitchen">
              <span class="big-emoji">⚠️</span>
              <h3>Sistema não encontrado</h3>
              <p>Abra o sistema principal primeiro</p>
            </div>`;
        }
      } catch(e) {
        console.error(e);
      }
    }

    // Poll every 3 seconds
    loadKitchenData();
    setInterval(loadKitchenData, 3000);

    // Sound alert for new orders (compare counts)
    let prevCount = 0;
    setInterval(() => {
      try {
        const raw = localStorage.getItem('plp_kitchen');
        if (!raw) return;
        const data = JSON.parse(raw);
        const count = (data.deliveryOrders||[]).length + (data.mesas||[]).length;
        if (count > prevCount) { playBeep(); }
        prevCount = count;
      } catch(e) {}
    }, 3000);
  </script>
</body>
</html>
